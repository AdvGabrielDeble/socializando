name: Temporary GD Fiscal Live Update Regression

on:
  push:
    branches: ["tmp-gd-fiscal-build-20260910"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-upgrade:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build legacy executable
        shell: pwsh
        run: |
          Set-Location _gd_build
          $files = Get-ChildItem -Filter *.go | ForEach-Object { $_.FullName }
          gofmt -w $files
          go build -trimpath -ldflags="-s -w -H=windowsgui" -o GD-Fiscal-Saude-MVP-LEGACY.exe .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Apply approved review workflow
        run: python .\_gd_build\apply_review_patch.py
      - name: Build revised executable
        shell: pwsh
        run: |
          Set-Location _gd_build
          $files = Get-ChildItem -Filter *.go | ForEach-Object { $_.FullName }
          gofmt -w $files
          go build -trimpath -ldflags="-s -w -H=windowsgui" -o GD-Fiscal-Saude-REVISAO-1.1.1.exe .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Reproduce update with old instance still running
        run: python .\_gd_build\live_upgrade_acceptance.py
